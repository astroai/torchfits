# torchfits conda recipe (rattler-build format).
#
# The version and the pytorch floor are rendered from scripts/torch_support.json
# by scripts/release_lane.py --apply, so the recipe tracks the same supported
# PyTorch range as the wheels.
#
# The build compiles the SAME sha256-pinned, patched vendored CFITSIO as the
# wheels (extern/vendor.sh + extern/VERSIONS.txt) so every distribution
# channel carries the PLIO buffer fix and BZIP2_1 support. The extension links
# no libtorch (tensors cross into PyTorch as DLPack capsules), so PyTorch is a
# run requirement only. The build uses bare CMake (pixi-build-cmake backend on
# pixi.toml); the CMake install rules mirror the scikit-build-core wheel
# layout (site-packages + console script).
#
# Not yet upstreamed. Local verification:
#   pixi run build   (or: rattler-build build -r packaging/conda)
# then install the resulting .conda into a fresh env with a supported pytorch
# and run tests/test_release_smoke.py.
schema_version: 1

context:
  version: "1.3.3"
  # Supported PyTorch floor, no upper bound. Rendered from
  # scripts/torch_support.json.
  torch_pin: ">=2.12"

package:
  name: torchfits
  version: ${{ version }}

source:
  path: ../../

build:
  number: 0
  script:
    # Block scalar: a plain multi-line scalar folds the lines and leaves
    # "\ " escapes, turning " -DTORCHFITS_..." into one bogus argument.
    - |
      cmake -G Ninja ${CMAKE_ARGS} -DCMAKE_BUILD_TYPE=Release \
        -DTORCHFITS_USE_VENDORED_CFITSIO=ON \
        -DTORCHFITS_NIOBUF=80 \
        -DTORCHFITS_MINDIRECT=8640 \
        -B $SRC_DIR/../build \
        -S $SRC_DIR/src/torchfits/cpp_src
    - cmake --build $SRC_DIR/../build --target install

requirements:
  build:
    - ${{ compiler("cxx") }}
    - cmake >=3.21
    - ninja
    - python >=3.11
    - nanobind >=3.0.1
    # Vendored-CFITSIO build needs the download at configure time; the
    # tarball is sha256-verified against extern/VERSIONS.txt (H4).
    - curl
    - git
  host:
    - python >=3.11
    - nanobind >=3.0.1
    - zlib >=1.2.13
    - bzip2  # enables BZIP2_1 in the vendored CFITSIO (parity with wheels)
  run:
    - python >=3.11
    - pytorch ${{ torch_pin }}
    - zlib >=1.2.13
    - numpy >=2.4.6
    - pyarrow >=25.0.0

tests:
  - python:
      imports:
        - torchfits
  - script:
      - torchfits --help

about:
  homepage: https://github.com/astroai/torchfits
  repository: https://github.com/astroai/torchfits
  documentation: https://astroai.github.io/torchfits/
  license: MIT
  license_file:
    - LICENSE
    - extern/licenses/CFITSIO-LICENSE.txt
  summary: FITS I/O for PyTorch with native tensor reads, datasets, and transforms
  description: |
    torchfits provides FITS I/O for PyTorch with native tensor reads,
    datasets, and transforms, built on CFITSIO. The native extension does
    not link libtorch: decoded buffers reach PyTorch through DLPack, so one
    build serves every supported PyTorch release.

extra:
  recipe-maintainers:
    - sfabbro
