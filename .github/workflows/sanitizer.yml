name: Sanitizers

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: sanitizer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  asan-ubsan:
    name: ASan+UBSan (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Linux covers the vendored-CFITSIO paths used by the wheels;
        # macOS arm64 exercises the Apple mmap/endian codepaths.
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          environments: test
          locked: true
          cache: true
      - name: Vendor CFITSIO
        run: bash extern/vendor.sh --cfitsio-version extern/VERSIONS.txt
      - name: Build with ASan+UBSan
        env:
          CC: clang
          CXX: clang++
        run: |
          # `-shared-libasan` is Linux clang; Apple clang links the ASan dylib
          # from `-fsanitize=address` and rejects that flag.
          san="-fsanitize=address -fsanitize=undefined -fno-omit-frame-pointer"
          link="-fsanitize=address -fsanitize=undefined"
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            san="${san} -shared-libasan"
            link="${link} -shared-libasan"
          fi
          # CMAKE_ARGS is appended after pyproject's cmake.args, so these win
          # over its "-DCMAKE_CXX_FLAGS=-O3" (cmake.define is emitted *before*
          # cmake.args and was silently overridden). The extensions are MODULE
          # and SHARED targets, so EXE linker flags never applied.
          export CMAKE_ARGS="-DCMAKE_C_FLAGS='${san}' -DCMAKE_CXX_FLAGS='${san}' -DCMAKE_SHARED_LINKER_FLAGS='${link}' -DCMAKE_MODULE_LINKER_FLAGS='${link}'"
          pixi run -e test -- pip install -e . --no-build-isolation --no-deps -v
          so="$(find build -name '_C*.so' -print -quit)"
          # Fail fast if instrumentation did not make it into the extension.
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            ldd "${so}" | grep asan
          else
            otool -L "${so}" | grep asan
          fi
        shell: bash
      - name: Native-heavy smoke under sanitizers
        env:
          # LeakSanitizer reports CPython's intentional interpreter leaks.
          # strip_env=0: on macOS the ASan runtime removes itself from
          # DYLD_INSERT_LIBRARIES at startup, so `python -c` children the tests
          # spawn load the instrumented extension without it and abort with
          # "Interceptors are not working". No-op on Linux (LD_PRELOAD stays).
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:strip_env=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TORCHFITS_TABLE_BUFFERED: "1"
        run: |
          # python is not instrumented, so the ASan runtime must be loaded
          # before anything else in the process.
          # The C++ probes in tests/ link the instrumented libtorchfits_core
          # (and its static CFITSIO), so they need the same sanitizer flags or
          # the link fails on undefined __asan_*/__ubsan_* symbols.
          export CXX="clang++ -fsanitize=address -fsanitize=undefined -fno-omit-frame-pointer"
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            CXX="${CXX} -shared-libasan"
            rt="$(clang -print-file-name=libclang_rt.asan-x86_64.so)"
            [[ -f "${rt}" ]] || rt="$(clang -print-file-name=libclang_rt.asan.so)"
            preload=LD_PRELOAD
          else
            rt="$(clang -print-file-name=libclang_rt.asan_osx_dynamic.dylib)"
            preload=DYLD_INSERT_LIBRARIES
          fi
          [[ -f "${rt}" ]] || { echo "ASan runtime not found: ${rt}" >&2; exit 1; }
          echo "${preload}=${rt}"
          # Preload only the test interpreter, not pixi itself.
          pixi run -e test -- env "${preload}=${rt}" python -m pytest \
            tests/test_io.py tests/test_checksum.py tests/test_bz2.py \
            tests/test_core_library.py tests/test_native_tree.py \
            tests/test_mutation_errors.py \
            -q --no-header
        shell: bash
