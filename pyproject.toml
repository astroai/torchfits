[build-system]
requires = [
    "scikit-build-core>=1.0.3",
    "nanobind>=3.0.1",
]
build-backend = "scikit_build_core.build"

[project]
name = "torchfits"
version = "1.4.0"
description = "FITS I/O for PyTorch with native tensor reads, datasets, and transforms"
authors = [{ name = "Seb Fabbro", email = "sebfabbro@gmail.com" }]
readme = "README.md"
license = "MIT"
keywords = ["fits", "astronomy", "pytorch", "tensor", "cfitsio"]
# Ship third-party license text (vendored CFITSIO, and libbz2, which Linux
# wheels bundle) alongside the project license in every wheel/sdist (M17).
license-files = [
    "LICENSE",
    "extern/licenses/CFITSIO-LICENSE.txt",
    "extern/licenses/BZIP2-LICENSE.txt",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Astronomy",
]
requires-python = ">=3.11"

# Core runtime dependencies for the library.
# These are automatically managed by pixi for conda packages
# but needed here for PyPI compatibility
dependencies = [
    # Supported floor, deliberately uncapped: the native extension links no
    # libtorch (results cross into PyTorch as DLPack capsules), so a wheel works
    # with every PyTorch from the floor up. The floor is the oldest minor CI
    # tests; scripts/torch_support.json owns it and scripts/release_lane.py
    # renders it here.
    "torch>=2.12",
    # Floors name the oldest release that still has wheels for the minimum
    # supported Python (3.11) and is within one minor of the newest release.
    # numpy 2.5 dropped cp311, so 2.4.6 is the newest floor 3.11 can install;
    # 3.12+ resolves 2.5.x from the same specifier.
    "numpy>=2.4.6",  # Core numerical operations
    "pyarrow>=25.0.0",  # Table I/O (Arrow interchange)
]

[project.scripts]
torchfits = "torchfits.cli.main:main"

[project.urls]
Homepage = "https://github.com/astroai/torchfits"
Documentation = "https://astroai.github.io/torchfits/"
Repository = "https://github.com/astroai/torchfits"

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "ruff>=0.16.7",
    "mypy>=2.3.1",
    "pandas>=2.2",
    "matplotlib>=3.11",
]
test = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "psutil",
]
docs = [
    "zensical>=0.0.61",
]
examples = [
    "matplotlib>=3.11",
]

[tool.scikit-build]
cmake.source-dir = "src/torchfits/cpp_src"
cmake.build-type = "Release"
cmake.args = [
    "-DTORCHFITS_USE_VENDORED_CFITSIO=ON",
    "-DTORCHFITS_NIOBUF=80",
    "-DTORCHFITS_MINDIRECT=8640",
    # No .cu kernels and no libtorch: the build needs neither CUDA nor
    # PyTorch. Do not point CUDA_TOOLKIT_ROOT_DIR at conda here -- that made
    # blank-machine pip source builds look for conda.
    "-DUSE_CUDA=OFF",
    "-DCMAKE_C_FLAGS=-O3",
    "-DCMAKE_CXX_FLAGS=-O3",
]

# Compiled extension is installed inside the torchfits package; keep the
# source tree out of the wheel.
install.strip = false
wheel.packages = ["src/torchfits"]
wheel.exclude = ["torchfits/cpp_src/**"]

# The extensions include and link no libtorch, so the wheel targets the CPython
# stable ABI rather than one PyTorch minor: one cp312-abi3 wheel per platform
# serves CPython >= 3.12 and every torch from the floor up. Building on 3.11
# (below the stable-ABI floor nanobind supports) yields a regular cp311 wheel.
wheel.py-api = "cp312"

# Incremental builds via CMake/Ninja for fast iteration.
build-dir = "build/{wheel_tag}"

# GitHub Release may attach an sdist; PyPI does not (pip must not compile).
[tool.scikit-build.sdist]
exclude = [".cursor/**", ".pixi/**", ".github/**"]
force-include = { "extern/cfitsio" = "extern/cfitsio" }

# Published wheels: Linux glibc x86_64 + aarch64, macOS arm64. CPython 3.12+
# shares one cp312-abi3 wheel per platform (cibuildwheel builds it once and
# tests it on every later CPython); 3.11 gets its own cp311 wheel. The
# extension links no libtorch, so the same wheel serves CPU and CUDA builds of
# every supported PyTorch. Free-threaded (cp315t) and musl are out of scope.
[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-* cp314-* cp315-*"
skip = "*-musllinux_* *-manylinux_i686 *-win32 cp31?t-*"
test-requires = ["numpy", "pyarrow", "pytest"]
build-frontend = { name = "pip", args = ["--no-build-isolation"] }
before-build = "bash {project}/scripts/cibw_before_build.sh"
test-command = "bash {project}/scripts/cibw_test.sh {project}"

[tool.cibuildwheel.linux]
# Native arch only by default (GHA sets CIBW_ARCHS per job: x86_64 or aarch64).
archs = ["auto"]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
before-all = "yum install -y bzip2-devel && bash ./extern/vendor.sh --cfitsio-version extern/VERSIONS.txt"
environment = { PIP_EXTRA_INDEX_URL = "https://download.pytorch.org/whl/cpu" }
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
archs = ["arm64"]
# The cp312-abi3 wheel also installs on CPython 3.15, but cibuildwheel does not
# test it there: torch 2.14's own cp315 macOS wheel was built against CPython
# 3.15.0b3 headers and segfaults on the first tensor op outside the main thread
# (pytorch/pytorch#200779). The Linux cp315 cells are unaffected. Repeat the
# free-threaded skip: a platform-specific `skip` replaces the global one.
skip = "cp31?t-* cp315-*"
before-all = "bash ./extern/vendor.sh --cfitsio-version extern/VERSIONS.txt"
environment = { _PYTHON_HOST_PLATFORM = "macosx-14.0-arm64", MACOSX_DEPLOYMENT_TARGET = "14.0", CMAKE_OSX_DEPLOYMENT_TARGET = "14.0", PIP_EXTRA_INDEX_URL = "https://download.pytorch.org/whl/cpu" }
# Nothing to delocate: libtorchfits_core ships beside the extension
# (@loader_path) and every other dependency is a macOS system library.
repair-wheel-command = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "performance: performance-oriented benchmark or stress tests",
    "integration: integration tests across multiple modules",
]

[tool.mypy]
strict = true

[tool.ruff.lint]
# Keep the lint policy stable across ruff releases: ruff 0.16 expanded the
# default rule set (bandit S1xx, bugbear B, naming N, comprehensions C4, ...).
# Pin the classic default select so new ruff versions never churn the tree.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
# The native type stubs are generated by scripts/gen_native_stub.py (and
# regenerated/checked by tests/test_native_stub.py and `pixi run check-stub`).
# Excluding them keeps the generator stdlib-only, so the drift gate runs
# wherever the extension and torch are importable rather than only where ruff is
# installed -- and stops `ruff format` from rewriting a generated file out from
# under the drift gate. `ruff check` still lints them.
exclude = ["src/torchfits/_C.pyi", "src/torchfits/_core.pyi"]

[[tool.mypy.overrides]]
module = "pyarrow.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pandas"]
ignore_missing_imports = true
